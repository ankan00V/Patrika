name: patrika

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: patrika
      POSTGRES_PASSWORD: patrika
      POSTGRES_DB: patrika
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrika"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF persistence: delayed jobs and rate-limit counters survive a Redis restart.
    # noeviction is required by BullMQ (evicting queue keys would silently lose jobs).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 20

volumes:
  pgdata:
  redisdata:
  esdata:
